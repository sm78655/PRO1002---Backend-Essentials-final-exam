{% extends 'base.html' %}

{% block content %}

<h1 class="mb-4">All Blog Posts</h1>

{% for post in posts %}

<div class="card mb-4">
    <div class="card-body">

        <h3>{{ post.title }}</h3>

        <p>
            <strong>Date:</strong>
            {{ post.created_at.strftime('%Y-%m-%d') }}
        </p>

        <p>
            {{ post.content[:150] }}...
        </p>

        <p>
            {% for tag in post.tags.split(',') %}
                <a href="/tag/{{ tag }}" class="badge bg-primary text-decoration-none">
                    {{ tag }}
                </a>
            {% endfor %}
        </p>

        <a href="/post/{{ post.id }}" class="btn btn-primary">
            Read More
        </a>

    </div>
</div>

{% endfor %}

{% endblock %}
