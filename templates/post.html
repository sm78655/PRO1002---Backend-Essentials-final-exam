{% extends 'base.html' %}{% block content %}<h1>{{ post.title }}</h1><p>{{ post.content }}</p><h3>Comments</h3>{% for comment in comments %}<div class='card p-2 mb-2'><h5>{{ comment.title }}</h5><p>{{ comment.content }}</p></div>{% endfor %}<form method='POST'><input name='title' class='form-control mb-2'><textarea name='content' class='form-control mb-2'></textarea><button class='btn btn-success'>Add Comment</button></form>{% endblock %}
